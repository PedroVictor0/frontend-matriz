<div class="container">
  <div class="card">

    <h2>Calculadora de Determinante 3x3</h2>
    <p class="subtitle">Preencha a matriz abaixo e clique em calcular.</p>

    <!-- MATRIZ 3x3: aninhamos os *ngFor para garantir row-major -->
    <div class="matrix">
      <div class="row" *ngFor="let row of matrix; let i = index">
        <input
          class="cell"
          type="text"
          [ngModel]="matrix[i][0] === null ? '' : matrix[i][0]"
          (input)="sanitize($event, i, 0)"
          inputmode="numeric"
          autocomplete="off"
        />
        <input
          class="cell"
          type="text"
          [ngModel]="matrix[i][1] === null ? '' : matrix[i][1]"
          (input)="sanitize($event, i, 1)"
          inputmode="numeric"
          autocomplete="off"
        />
        <input
          class="cell"
          type="text"
          [ngModel]="matrix[i][2] === null ? '' : matrix[i][2]"
          (input)="sanitize($event, i, 2)"
          inputmode="numeric"
          autocomplete="off"
        />
      </div>
    </div>

    <button class="btn"
      [disabled]="!isMatrixValid()"
      (click)="calculateDeterminant()">
      Calcular Determinante
    </button>

    <div *ngIf="determinant !== null" class="result">
      <strong>Determinante:</strong> {{ determinant }}
    </div>

  </div>
</div>
